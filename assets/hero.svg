<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Bhojanapu Deva Raj">
<defs>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></linearGradient>
</defs>
<rect width="1000" height="320" rx="28" fill="#0a0a14"/>
<g filter="url(#b)">
<circle cx="230" cy="120" r="120" fill="#7c3aed"><animate attributeName="cx" values="230;300;230" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="120;180;120" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="780" cy="220" r="130" fill="#06b6d4"><animate attributeName="cx" values="780;700;780" dur="17s" repeatCount="indefinite"/><animate attributeName="cy" values="220;130;220" dur="17s" repeatCount="indefinite"/></circle>
<circle cx="520" cy="60" r="80" fill="#ec4899" opacity=".6"><animate attributeName="cx" values="520;600;520" dur="20s" repeatCount="indefinite"/></circle>
</g>
<rect x="110" y="50" width="780" height="220" rx="28" fill="url(#sheen)" stroke="url(#edge)" stroke-width="1.5"/>
<text x="500" y="140" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="600" fill="#fff" letter-spacing="-1">Bhojanapu Deva Raj</text>
<text x="500" y="182" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#c4b5fd">AI &amp; Full-Stack Developer</text>
<text x="500" y="222" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8" letter-spacing="2">MERN  ·  REACT  ·  PYTHON  ·  CLOUD</text>
</svg>